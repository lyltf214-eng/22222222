<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كتاب البرمجة الكائنية في جافاسكربت | JavaScript OOP</title>
    <!-- Google Fonts Cairo & JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Prism.js for Syntax Highlighting Theme -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">

    <style>
        :root {
            --bg-primary: #0f1015;
            --bg-secondary: #171922;
            --bg-card: #1f222e;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --gold-primary: #d4af37;
            --gold-light: #fef1c7;
            --gold-dark: #aa8513;
            --gold-gradient: linear-gradient(135deg, #f3d068, #b8860b);
            --border-color: rgba(212, 175, 55, 0.25);
            --shadow-lux: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(212, 175, 55, 0.1);
            --code-bg: #121319;
            --sidebar-width: 280px;
        }

        [data-theme="light"] {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-card: #f1f5f9;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --gold-primary: #b8860b;
            --gold-light: #2d2407;
            --gold-dark: #8b6508;
            --gold-gradient: linear-gradient(135deg, #d4af37, #996515);
            --border-color: rgba(184, 134, 11, 0.3);
            --shadow-lux: 0 10px 25px rgba(0, 0, 0, 0.08), 0 0 10px rgba(184, 134, 11, 0.1);
            --code-bg: #1e1e24;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        html, body {
            width: 100%;
            overflow-x: hidden; /* منع التمرير الأفقي تماماً */
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Reading Progress Bar */
        .progress-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: rgba(0, 0, 0, 0.2);
            z-index: 1000;
        }

        .progress-bar {
            height: 100%;
            background: var(--gold-gradient);
            width: 0%;
            box-shadow: 0 0 10px var(--gold-primary);
            transition: width 0.2s ease;
        }

        /* Top Header */
        header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 900;
            box-shadow: var(--shadow-lux);
            height: 65px;
            width: 100%;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-brand i {
            font-size: 1.4rem;
            color: var(--gold-primary);
        }

        .header-brand h1 {
            font-size: 1.1rem;
            font-weight: 700;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            white-space: nowrap;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-icon {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--gold-primary);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.95rem;
            flex-shrink: 0;
        }

        .btn-icon:hover {
            background: var(--gold-primary);
            color: #000;
        }

        /* Search Container */
        .search-box {
            position: relative;
            flex: 1;
            max-width: 220px;
            margin: 0 10px;
        }

        .search-box input {
            width: 100%;
            padding: 6px 32px 6px 10px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.8rem;
            outline: none;
        }

        .search-box i {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold-primary);
            font-size: 0.85rem;
        }

        /* Layout Main */
        .app-layout {
            display: flex;
            flex: 1;
            width: 100%;
            position: relative;
        }

        /* Sidebar Overlay */
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(3px);
            z-index: 940;
            display: none;
        }

        .sidebar-overlay.active {
            display: block;
        }

        /* 🖥️ Sidebar (Computer View Default) */
        aside {
            width: var(--sidebar-width);
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 65px;
            height: calc(100vh - 65px);
            overflow-y: auto;
            z-index: 950;
            flex-shrink: 0;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--gold-primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .index-list {
            list-style: none;
            padding: 10px;
        }

        .index-item {
            margin-bottom: 6px;
        }

        .index-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
        }

        .index-link:hover, .index-link.active {
            background: var(--bg-card);
            color: var(--gold-primary);
            border-right: 4px solid var(--gold-primary);
        }

        .index-link i {
            font-size: 0.95rem;
            width: 20px;
            text-align: center;
        }

        /* Content Area */
        main {
            flex: 1;
            padding: 30px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 0; /* منع الخروج عن العرض في flexbox */
        }

        /* Chapter Card / Page Display */
        .book-page {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            box-shadow: var(--shadow-lux);
            animation: fadeIn 0.4s ease-in-out;
            width: 100%;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chapter-tag {
            display: inline-block;
            background: var(--gold-light);
            color: var(--gold-dark);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 15px;
            border: 1px solid var(--gold-primary);
        }

        .book-page h2 {
            font-size: 1.5rem;
            color: var(--text-main);
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            word-break: break-word;
        }

        .book-page p {
            line-height: 1.8;
            color: var(--text-main);
            font-size: 1rem;
            margin-bottom: 16px;
        }

        /* Code Block Styling */
        .code-container {
            position: relative;
            margin: 20px 0;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            width: 100%;
        }

        .code-header {
            background: #1a1c23;
            padding: 8px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .code-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--gold-primary);
        }

        .btn-copy {
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        pre {
            background: var(--code-bg) !important;
            margin: 0 !important;
            padding: 14px !important;
            overflow-x: auto; /* شريط تمرير داخلي للأكواد فقط */
            direction: ltr;
            text-align: left;
            width: 100%;
        }

        code {
            font-family: 'JetBrains Mono', monospace !important;
            font-size: 0.85rem !important;
        }

        /* Footer Nav */
        .page-navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
            gap: 10px;
        }

        .nav-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .page-indicator {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--gold-primary);
            white-space: nowrap;
        }

        /* 📱 الجوال (الشاشات أقل من 850 بكسل) */
        @media (max-width: 850px) {
            /* إخراج القائمة تماماً من محاذاة الصفحة لتحول القائمة لمنسدلة من الأعلى */
            aside {
                position: fixed;
                top: 65px;
                right: 0;
                left: 0;
                width: 100%;
                max-height: 75vh;
                height: auto;
                border-left: none;
                border-bottom: 2px solid var(--gold-primary);
                border-radius: 0 0 16px 16px;
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
                transform: translateY(-150%);
                opacity: 0;
                visibility: hidden;
            }

            aside.open {
                transform: translateY(0);
                opacity: 1;
                visibility: visible;
            }

            main {
                padding: 15px 10px;
                width: 100%;
            }

            .book-page {
                padding: 18px 12px;
            }

            .search-box {
                max-width: 130px;
            }
        }
    </style>
</head>
<body data-theme="dark">

    <!-- Progress Bar -->
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- Header -->
    <header>
        <div class="header-brand">
            <button class="btn-icon" id="toggleSidebar" onclick="toggleSidebar()" title="قائمة الفهرس">
                <i class="fa-solid fa-bars"></i>
            </button>
            <i class="fa-solid fa-book-bookmark"></i>
            <h1>كتاب JS OOP</h1>
        </div>

        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="بحث..." onkeyup="searchBook()">
        </div>

        <div class="header-controls">
            <button class="btn-icon" onclick="toggleTheme()" title="تغيير المظهر">
                <i class="fa-solid fa-moon" id="themeIcon"></i>
            </button>
        </div>
    </header>

    <div class="app-layout">
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

        <!-- Sidebar -->
        <aside id="sidebar">
            <div class="sidebar-header">
                <span><i class="fa-solid fa-list-ol"></i> فهرس الكتاب</span>
                <button class="btn-icon" onclick="closeSidebar()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <ul class="index-list">
                <li class="index-item"><a class="index-link active" onclick="goToPage(0)"><i class="fa-solid fa-book-open"></i> الغلاف والمقدمة</a></li>
                <li class="index-item"><a class="index-link" onclick="goToPage(1)"><i class="fa-solid fa-cubes"></i> 1. مفهوم OOP والـ Prototype</a></li>
                <li class="index-item"><a class="index-link" onclick="goToPage(2)"><i class="fa-solid fa-code"></i> 2. الكلاسات (Classes)</a></li>
                <li class="index-item"><a class="index-link" onclick="goToPage(3)"><i class="fa-solid fa-bolt"></i> 3. العناصر الثابتة (Static)</a></li>
                <li class="index-item"><a class="index-link" onclick="goToPage(4)"><i class="fa-solid fa-user-lock"></i> 4. التغليف (Encapsulation)</a></li>
                <li class="index-item"><a class="index-link" onclick="goToPage(5)"><i class="fa-solid fa-sitemap"></i> 5. الوراثة (Inheritance)</a></li>
                <li class="index-item"><a class="index-link" onclick="goToPage(6)"><i class="fa-solid fa-masks-theater"></i> 6. تعدد الأشكال (Polymorphism)</a></li>
                <li class="index-item"><a class="index-link" onclick="goToPage(7)"><i class="fa-solid fa-diagram-project"></i> 7. مشروع عملي متكامل</a></li>
                <li class="index-item"><a class="index-link" onclick="goToPage(8)"><i class="fa-solid fa-square-check"></i> التلخيص والخاتمة</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main>
            <div id="pageContainer"></div>

            <!-- Page Navigation -->
            <div class="page-navigation">
                <button class="nav-btn" id="prevBtn" onclick="prevPage()"><i class="fa-solid fa-arrow-right"></i> السابقة</button>
                <span class="page-indicator" id="pageIndicator">صفحة 1 من 9</span>
                <button class="nav-btn" id="nextBtn" onclick="nextPage()">التالية <i class="fa-solid fa-arrow-left"></i></button>
            </div>
        </main>
    </div>

    <!-- JavaScript logic -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script>
        const bookPages = [
            {
                chapter: "الغلاف والمقدمة",
                title: "الكتاب الشامل في البرمجة الكائنية (OOP in JS)",
                content: `
                    <div style="text-align: center; padding: 10px 0;">
                        <i class="fa-solid fa-laptop-code" style="font-size: 3rem; color: var(--gold-primary); margin-bottom: 15px;"></i>
                        <h1 style="font-size: 1.5rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px;">دليل جافاسكربت الحديثة للبرمجة الكائنية</h1>
                        <p style="font-size: 0.95rem; color: var(--text-muted);">مرجع تفاعلي وشامل لتعلم معمارية OOP بلغة JavaScript</p>
                    </div>
                `
            },
            {
                chapter: "الفصل الأول",
                title: "مفهوم البرمجة الكائنية والـ Prototype",
                content: `<p>تعتمد البرمجة الكائنية على تجميع البيانات والدوال داخل كائنات محددة.</p>${createCodeBlock(`const student = { name: "دانيه", age: 22 };`, 'javascript', 'الكائنات البسيطة')}`
            },
            {
                chapter: "الفصل الثاني",
                title: "الكلاسات في JavaScript (Classes)",
                content: `<p>الكلاسات توفر صياغة أسهل للتعامل مع النماذج الأولية.</p>${createCodeBlock(`class User {\n    constructor(name) { this.name = name; }\n}`, 'javascript', 'الكلاسات')}`
            },
            {
                chapter: "الفصل الثالث",
                title: "الدوال والخصائص الثابتة (Static Members)",
                content: `<p>العناصر الثابتة ترتبط بالكلاس نفسه مباشرةً وليس بالنُسخ المشتقة منه.</p>${createCodeBlock(`class MathUtils {\n    static PI = 3.14159;\n}`, 'javascript', 'Static')}`
            },
            {
                chapter: "الفصل الرابع",
                title: "التغليف (Encapsulation)",
                content: `<p>إخفاء وحماية البيانات باستخدام الحقول الخاصة #.</p>${createCodeBlock(`class BankAccount {\n    #balance = 0;\n}`, 'javascript', 'Encapsulation')}`
            },
            {
                chapter: "الفصل الخامس",
                title: "الوراثة (Inheritance)",
                content: `<p>استخدام الكلمة المفتاحية extends لوراثة الخصائص.</p>${createCodeBlock(`class Manager extends Employee {}`, 'javascript', 'Inheritance')}`
            },
            {
                chapter: "الفصل السادس",
                title: "تعدد الأشكال (Polymorphism)",
                content: `<p>استجابة الكائنات المختلفة لنفس اسم الدالة بطرق مختلفة.</p>`
            },
            {
                chapter: "الفصل السابع",
                title: "مشروع عملي متكامل",
                content: `<p>تطبيق عملي لبناء منصة إدارة تعليمية بالكامل.</p>`
            },
            {
                chapter: "التلخيص والخاتمة",
                title: "جدول الملخص وخاتمة الكتاب",
                content: `<p>خاتمة وتلخيص لأهم مفاهيم OOP في جافاسكربت.</p>`
            }
        ];

        let currentPage = 0;

        function createCodeBlock(code, lang, title) {
            const escapedCode = code.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            return `
                <div class="code-container">
                    <div class="code-header">
                        <span class="code-title">${title}</span>
                    </div>
                    <pre><code class="language-${lang}">${escapedCode}</code></pre>
                </div>
            `;
        }

        window.onload = function() {
            renderPage();
        };

        function renderPage() {
            const container = document.getElementById('pageContainer');
            const page = bookPages[currentPage];

            container.innerHTML = `
                <div class="book-page">
                    <span class="chapter-tag">${page.chapter}</span>
                    <h2>${page.title}</h2>
                    <div>${page.content}</div>
                </div>
            `;

            document.getElementById('pageIndicator').innerText = `صفحة ${currentPage + 1} من ${bookPages.length}`;
            document.getElementById('prevBtn').disabled = currentPage === 0;
            document.getElementById('nextBtn').disabled = currentPage === bookPages.length - 1;

            const progress = ((currentPage + 1) / bookPages.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';

            const links = document.querySelectorAll('.index-link');
            links.forEach((link, idx) => {
                if(idx === currentPage) link.classList.add('active');
                else link.classList.remove('active');
            });

            if(window.Prism) Prism.highlightAll();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goToPage(index) {
            currentPage = index;
            renderPage();
            closeSidebar();
        }

        function nextPage() {
            if (currentPage < bookPages.length - 1) {
                currentPage++;
                renderPage();
            }
        }

        function prevPage() {
            if (currentPage > 0) {
                currentPage--;
                renderPage();
            }
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('active');
        }

        function toggleTheme() {
            const body = document.body;
            if (body.getAttribute('data-theme') === 'dark') {
                body.setAttribute('data-theme', 'light');
            } else {
                body.setAttribute('data-theme', 'dark');
            }
        }
    </script>
</body>
</html>
